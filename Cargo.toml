[workspace]
members = [
    "crates/solstone-linux",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.92"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic stays "unwind": Restart=on-failure plus the watchdog make either strategy
# safe, so abort buys nothing today. Re-decide at cutover, not as a size cleanup.
panic = "unwind"
