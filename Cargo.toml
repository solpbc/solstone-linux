[workspace]
members = [
    "crates/rust-release-manifest",
    "crates/solstone-linux",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
spl-core = { version = "0.1.0", git = "https://github.com/solpbc/spl-rust", rev = "b124a4dd2e5f6c6a210ec07675a384a3f614b234" }
spl-transport = { version = "0.1.0", git = "https://github.com/solpbc/spl-rust", rev = "b124a4dd2e5f6c6a210ec07675a384a3f614b234" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic stays "unwind": Restart=on-failure plus the watchdog make either strategy
# safe, so abort buys nothing today. Re-decide at cutover, not as a size cleanup.
panic = "unwind"
