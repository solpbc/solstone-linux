[package]
name = "solstone-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "solstone-terminal"
path = "src/bin/solstone-terminal.rs"

[features]
# `full-tests` selects tests that start a process or wait on the wall clock;
# `make ci-full` runs them. Not a shipping feature.
full-tests = []

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
jiff = { version = "0.2.37", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
rustix = { version = "1", features = ["fs", "process", "system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["process", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
