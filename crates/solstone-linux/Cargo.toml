# On rpm the conditional IS expressible, so it is used: dnf and zypper honour weak
# dependencies by default, and `if` makes the recommendation apply only where GNOME Shell
# is already installed. ⛔ Never `requires` -- that would drag gnome-shell onto KDE and
# headless installs and make a cosmetic dependency fatal.
#
# ⚠ The package alone does not deliver a panel icon: it needs a session restart and then
# an explicit enable, which is exactly what `solstone-linux panel-icon` does. This makes
# the bits present, not the icon visible.
[package.metadata.generate-rpm.recommends]
gtk4 = ">= 4.6"
bubblewrap = "*"
xdg-dbus-proxy = "*"
"libatomic.so.1()(64bit)" = "*"
"libenchant-2.so.2()(64bit)" = "*"
"libgbm.so.1()(64bit)" = "*"
"libgcrypt.so.20()(64bit)" = "*"
"libgstgl-1.0.so.0()(64bit)" = "*"
"libharfbuzz-icu.so.0()(64bit)" = "*"
"libhyphen.so.0()(64bit)" = "*"
"libsecret-1.so.0()(64bit)" = "*"
"libsoup-3.0.so.0()(64bit)" = "*"
"libwayland-server.so.0()(64bit)" = "*"
"libwebpdemux.so.2()(64bit)" = "*"
"libwebpmux.so.3()(64bit)" = "*"
"libxslt.so.1()(64bit)" = "*"
