[package]
name = "solstone-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Linux desktop observer that experiences screen and audio along with its owner"
homepage = "https://solstone.app"
repository = "https://github.com/solpbc/solstone-linux"

[lints]
workspace = true

[dependencies]
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
claxon = "0.4.3"
flac-bound = { version = "0.5.0", default-features = false, features = ["libflac-noogg"] }
libpulse-binding = "2.30.1"
chrono = "0.4"
rustix = { version = "1", features = ["event", "fs", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "multipart", "stream"] }
spl-core = { version = "0.1.0", git = "https://github.com/solpbc/spl-rust", rev = "742bc9dc789c5a75658844849a04d75033aeb6e3" }
spl-transport = { version = "0.1.0", git = "https://github.com/solpbc/spl-rust", rev = "742bc9dc789c5a75658844849a04d75033aeb6e3" }
tokio = { workspace = true, features = ["signal", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
ashpd = { version = "=0.13.12", features = ["screencast"] }
futures-util = "0.3"
gstreamer = "=0.25.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
x11rb = { version = "0.13", default-features = false, features = ["randr", "dpms", "screensaver"] }
ksni = "=0.3.6"
open = "5.4.0"
notify-rust = { version = "=4.18.0", default-features = false, features = ["z-with-tokio"] }
zbus = { version = "=5.17.0", features = ["tokio"] }
sd-notify = "0.5.0"

[build-dependencies]
resvg = { version = "0.47", default-features = false }

[dev-dependencies]
rust-release-manifest = { version = "1.0.0", path = "../rust-release-manifest" }
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "sync", "test-util"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
roxmltree = "0.21"
toml = "1"

# cargo-deb resolves ordinary sources from this member package. The target/release
# prefix is cargo-deb's special workspace-aware spelling for a built binary.
[package.metadata.deb]
maintainer = "sol pbc <jer@solpbc.org>"
copyright = "2026 sol pbc"
license-file = ["../../LICENSE", "0"]
extended-description = "A standalone Linux desktop observer that experiences screen and audio along with its owner and syncs segments to their solstone journal."
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/solstone-linux", "usr/bin/", "755"],
    ["../../LICENSE", "usr/share/doc/solstone-linux/LICENSE", "644"],
    ["../../packaging/INSTALL-NOTES", "usr/share/doc/solstone-linux/INSTALL-NOTES", "644"],
    ["../../contrib/icons/hicolor/16x16/apps/solstone-observer.png", "usr/share/icons/hicolor/16x16/apps/solstone-observer.png", "644"],
    ["../../contrib/icons/hicolor/24x24/apps/solstone-observer.png", "usr/share/icons/hicolor/24x24/apps/solstone-observer.png", "644"],
    ["../../contrib/icons/hicolor/32x32/apps/solstone-observer.png", "usr/share/icons/hicolor/32x32/apps/solstone-observer.png", "644"],
    ["../../contrib/icons/hicolor/48x48/apps/solstone-observer.png", "usr/share/icons/hicolor/48x48/apps/solstone-observer.png", "644"],
    ["../../contrib/icons/hicolor/64x64/apps/solstone-observer.png", "usr/share/icons/hicolor/64x64/apps/solstone-observer.png", "644"],
    ["../../contrib/icons/hicolor/128x128/apps/solstone-observer.png", "usr/share/icons/hicolor/128x128/apps/solstone-observer.png", "644"],
    ["../../contrib/icons/hicolor/256x256/apps/solstone-observer.png", "usr/share/icons/hicolor/256x256/apps/solstone-observer.png", "644"],
    ["../../contrib/icons/hicolor/512x512/apps/solstone-observer.png", "usr/share/icons/hicolor/512x512/apps/solstone-observer.png", "644"],
    ["../../contrib/icons/hicolor/scalable/apps/solstone-observer.svg", "usr/share/icons/hicolor/scalable/apps/solstone-observer.svg", "644"],
    ["../../contrib/icons/hicolor/scalable/status/solstone-error.svg", "usr/share/icons/hicolor/scalable/status/solstone-error.svg", "644"],
    ["../../contrib/icons/hicolor/scalable/status/solstone-paused.svg", "usr/share/icons/hicolor/scalable/status/solstone-paused.svg", "644"],
    ["../../contrib/icons/hicolor/scalable/status/solstone-recording.svg", "usr/share/icons/hicolor/scalable/status/solstone-recording.svg", "644"],
    ["../../contrib/icons/hicolor/scalable/status/solstone-syncing.svg", "usr/share/icons/hicolor/scalable/status/solstone-syncing.svg", "644"],
]

# cargo-generate-rpm resolves sources from build-release.sh's workspace-root CWD
# before falling back to this package directory. Keep these paths root-relative.
[package.metadata.generate-rpm]
license = "AGPL-3.0-only"
auto-req = "auto"
assets = [
    { source = "target/release/solstone-linux", dest = "/usr/bin/solstone-linux", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/doc/solstone-linux/LICENSE", mode = "644", doc = true },
    { source = "packaging/INSTALL-NOTES", dest = "/usr/share/doc/solstone-linux/INSTALL-NOTES", mode = "644", doc = true },
    { source = "contrib/icons/hicolor/16x16/apps/solstone-observer.png", dest = "/usr/share/icons/hicolor/16x16/apps/solstone-observer.png", mode = "644" },
    { source = "contrib/icons/hicolor/24x24/apps/solstone-observer.png", dest = "/usr/share/icons/hicolor/24x24/apps/solstone-observer.png", mode = "644" },
    { source = "contrib/icons/hicolor/32x32/apps/solstone-observer.png", dest = "/usr/share/icons/hicolor/32x32/apps/solstone-observer.png", mode = "644" },
    { source = "contrib/icons/hicolor/48x48/apps/solstone-observer.png", dest = "/usr/share/icons/hicolor/48x48/apps/solstone-observer.png", mode = "644" },
    { source = "contrib/icons/hicolor/64x64/apps/solstone-observer.png", dest = "/usr/share/icons/hicolor/64x64/apps/solstone-observer.png", mode = "644" },
    { source = "contrib/icons/hicolor/128x128/apps/solstone-observer.png", dest = "/usr/share/icons/hicolor/128x128/apps/solstone-observer.png", mode = "644" },
    { source = "contrib/icons/hicolor/256x256/apps/solstone-observer.png", dest = "/usr/share/icons/hicolor/256x256/apps/solstone-observer.png", mode = "644" },
    { source = "contrib/icons/hicolor/512x512/apps/solstone-observer.png", dest = "/usr/share/icons/hicolor/512x512/apps/solstone-observer.png", mode = "644" },
    { source = "contrib/icons/hicolor/scalable/apps/solstone-observer.svg", dest = "/usr/share/icons/hicolor/scalable/apps/solstone-observer.svg", mode = "644" },
    { source = "contrib/icons/hicolor/scalable/status/solstone-error.svg", dest = "/usr/share/icons/hicolor/scalable/status/solstone-error.svg", mode = "644" },
    { source = "contrib/icons/hicolor/scalable/status/solstone-paused.svg", dest = "/usr/share/icons/hicolor/scalable/status/solstone-paused.svg", mode = "644" },
    { source = "contrib/icons/hicolor/scalable/status/solstone-recording.svg", dest = "/usr/share/icons/hicolor/scalable/status/solstone-recording.svg", mode = "644" },
    { source = "contrib/icons/hicolor/scalable/status/solstone-syncing.svg", dest = "/usr/share/icons/hicolor/scalable/status/solstone-syncing.svg", mode = "644" },
]
