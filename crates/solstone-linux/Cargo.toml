[package]
name = "solstone-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
claxon = "0.4.3"
flac-bound = { version = "0.5.0", default-features = false, features = ["libflac-nobuild"] }
libpulse-binding = "2.30.1"
chrono = "0.4"
rustix = { version = "1", features = ["event", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { workspace = true, features = ["signal", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
ashpd = { version = "=0.13.12", features = ["screencast"] }
gstreamer = "=0.25.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
x11rb = { version = "0.13", default-features = false, features = ["randr"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["net", "test-util"] }
