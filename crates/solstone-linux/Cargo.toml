[package]
name = "solstone-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "the solstone app for linux: what you share goes into your journal" # Generated by scripts/i18n.py.
homepage = "https://solstone.app"
repository = "https://github.com/solpbc/solstone-linux"

[lints]
workspace = true

[dependencies]
solstone-i18n = { version = "2.0.45", path = "../solstone-i18n" }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
claxon = "0.4.3"
flac-bound = { version = "0.5.0", default-features = false, features = ["libflac-noogg"] }
libpulse-binding = "2.30.1"
jiff = { version = "1.0.0", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
rustix = { version = "1", features = ["event", "fs", "process", "system", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "multipart", "stream"] }
spl-core.workspace = true
spl-transport.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
ashpd = { version = "=0.13.12", features = ["screencast"] }
futures-util = "0.3"
gstreamer = "=0.25.3"
gio = "=0.22.10"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
x11rb = { version = "0.13", default-features = false, features = ["randr", "dpms", "screensaver"] }
ksni = "=0.3.6"
open = "5.4.0"
notify-rust = { version = "=4.18.0", default-features = false, features = ["z-with-tokio"] }
zbus = { version = "=5.17.0", features = ["tokio"] }
sd-notify = "0.5.0"
solstone-folder-sync = { version = "0.1.0", path = "../solstone-folder-sync" }
solstone-vault = { version = "0.1.0", path = "../solstone-vault" }
solstone-terminal = { version = "2.0.0", path = "../solstone-terminal" }
native-browser-frame = { version = "1.0.0", path = "../../vendor/crates/native-browser-frame" }
url = "=2.5.8"
roxmltree = "0.21"

[features]
default = ["browser"]
# `browser` is enabled by default for production host mode and registrations;
# `browser-dev-host` also admits the unpacked development extension, and no
# release target sets it.
browser = []
browser-dev-host = ["browser"]
# `full-tests` selects tests that start a process, open a socket, read host
# state or wait on the wall clock; `make ci-full` runs them. Not a shipping feature.
full-tests = []

[build-dependencies]
resvg = { version = "0.48.1", default-features = false }

[dev-dependencies]
rustix = { version = "1", features = ["pty", "termios"] }
rust-release-manifest = { version = "2.0.0", path = "../rust-release-manifest" }
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["io-util", "net", "process", "rt-multi-thread", "sync", "test-util"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"

# cargo-deb resolves ordinary sources from this member package. The target/release
# prefix is cargo-deb's special workspace-aware spelling for a built binary.
[package.metadata.deb]
maintainer = "sol pbc <jer@solpbc.org>"
copyright = "2026 sol pbc"
# Generated by `rust-release-manifest notices deb-copyright` before `cargo deb`: the
# AGPL, the mark font's OFL and the dependency notices. Minimized Ubuntu images keep
# only `copyright` from /usr/share/doc, so every licence has to be in it.
license-file = ["../../target/deb-copyright", "0"]
extended-description = "the solstone app for linux. it takes in the screen and audio you share with it, and all of it goes into your journal." # Generated by scripts/i18n.py.
# Written out rather than `$auto`, which would make the window's GTK a hard requirement:
# the app runs without GTK on a computer with no desktop. These are the daemon's own
# linked libraries (the package audit pins them).
depends = "libc6 (>= 2.35), libgcc-s1, libglib2.0-0 | libglib2.0-0t64, libgstreamer1.0-0, libpulse0, libglib2.0-bin"
# GNOME shows no panel icon without an AppIndicator extension, so `solstone-linux
# panel-icon` sets one up on request. The distribution's own package is the other route.
#
# ⛔ Deliberately `suggests`, not `recommends`, and NOT the conditional the RPM side uses.
# Debian's dependency grammar (Policy 7.1) has no conditional operator -- no `if`, no
# boolean -- so "only when gnome-shell is installed" is not expressible here at all, and
# cargo-deb writes whatever string it is given straight into `control` without validating
# it. A plain `recommends` would be honoured by apt's default `Install-Recommends "1"`,
# and this package hard-`Depends: gnome-shell`, so it would pull GNOME Shell onto KDE and
# headless installs. `suggests` is ignored by default (`Install-Suggests "0"`), which
# records the relationship without imposing it.
suggests = "gnome-shell-extension-appindicator, tmux"
# The panel icon's "copy" hands its text to wl-copy on Wayland and xclip on X11: a
# background app can't set a Wayland clipboard by itself. Recommended, so a missing
# tool costs only the copy, never the install.
recommends = "libgtk-4-1 (>= 4.6), wl-clipboard, xclip, bubblewrap, xdg-dbus-proxy, libsoup-3.0-0, libharfbuzz-icu0, libwebpdemux2, libwebpmux3, libxslt1.1, libenchant-2-2, libhyphen0, libsecret-1-0, libgles2, libegl1, libgudev-1.0-0, libevdev2, libatomic1, libwayland-server0, gstreamer1.0-gl, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav"
section = "utils"
priority = "optional"
