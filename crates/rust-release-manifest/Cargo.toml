[package]
name = "rust-release-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ar = "0.9.0"
base64 = "0.22"
chrono = "0.4"
clap = { workspace = true, features = ["derive"] }
flate2 = "1"
jsonschema = { version = "=0.48.1", default-features = false }
rpm = { version = "0.23.5", default-features = false, features = ["payload", "zstd-compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "1"
xz2 = "0.1.7"
zstd = { version = "0.13.3", default-features = false }

[dev-dependencies]
tempfile = "3"
