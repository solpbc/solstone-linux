[advisories]
yanked = "deny"
ignore = [
    # Build-only via wayland-scanner; it parses crate-bundled protocol XML, not
    # runtime or untrusted input. Remove when wayland-scanner accepts quick-xml >=0.41.
    { id = "RUSTSEC-2026-0194", reason = "Owner: sol pbc engineering. Build-only via wayland-scanner; it parses crate-bundled protocol XML, not runtime or untrusted input. Remove when wayland-scanner accepts quick-xml >=0.41." },
    { id = "RUSTSEC-2026-0195", reason = "Owner: sol pbc engineering. Build-only via wayland-scanner; it parses crate-bundled protocol XML, not runtime or untrusted input. Remove when wayland-scanner accepts quick-xml >=0.41." },
    # These maintenance notices describe consolidation into zbus 6. The portal,
    # tray and notification dependencies still require zbus 5, so changing the
    # direct dependency alone cannot remove its wire-format helpers.
    { id = "RUSTSEC-2026-0371", reason = "Owner: sol pbc engineering. Compatibility exception for zbus_names 4.3.3 via zbus 5.17.0: ashpd 0.13.x, ksni 0.3.6 and notify-rust 4.18.x require zbus 5. Runtime names arrive through Observer1, portals, tray/notifications and session/system activity. Owner and read-model fences operate after wire decoding, not as parser isolation. Reassess on dependency or input-boundary changes, new advisories, and coordinated consumer releases that eliminate zbus 5; remove with this package. Upstream migration: https://github.com/z-galaxy/zbus/issues/2043." },
    { id = "RUSTSEC-2026-0370", reason = "Owner: sol pbc engineering. Compatibility exception for zvariant 5.13.0 via zbus 5.17.0: ashpd 0.13.x, ksni 0.3.6 and notify-rust 4.18.x require zbus 5. It decodes untrusted Observer1 calls/replies, portal responses, tray/notifications and session/system activity. Owner and read-model fences operate after wire decoding, not as parser isolation. Reassess on dependency or input-boundary changes, new advisories, and coordinated consumer releases that eliminate zbus 5; remove with this package. Upstream migration: https://github.com/z-galaxy/zbus/issues/2043." },
    { id = "RUSTSEC-2026-0372", reason = "Owner: sol pbc engineering. Compatibility exception for build-time procedural macro zvariant_derive 5.13.0 via zvariant 5.13.0 and zbus 5.17.0: ashpd 0.13.x, ksni 0.3.6 and notify-rust 4.18.x require zbus 5. Generated wire decoding handles untrusted session/system bus input; application consistency checks are not parser isolation. Reassess on dependency or input-boundary changes, new advisories, and coordinated consumer releases that eliminate zbus 5; remove with this package. Upstream migration: https://github.com/z-galaxy/zbus/issues/2043." },
    # Release tooling only (temporary): the zstd family reaches rust-release-manifest
    # directly and through rpm 0.23.5, never the shipped binaries. Remove with the
    # move to rpm >= 0.29 and zstd >= 0.14.3.
    { id = "RUSTSEC-2026-0391", reason = "Owner: sol pbc engineering. Temporary exception. zstd with_context constructors (>= 0.13.2, < 0.14.3): not called; every stream uses Encoder/Decoder::new, which creates a fresh context. Release tooling only: zstd 0.13.3, zstd-safe 7.2.4 and zstd-sys 2.0.16 reach rust-release-manifest directly and via rpm 0.23.5 (zstd ^0.13), never the shipped solstone-linux or solstone-linux-window binaries (normal and build dependencies; only solstone-linux's tests link the tool), and the tool reads only release packages we built or retained locally. Remove all four when rust-release-manifest moves to rpm >= 0.29 and zstd >= 0.14.3 (zstd-safe >= 8.2.0, zstd-sys >= 2.1.2); reassess on any new zstd advisory or a new input source." },
    { id = "RUSTSEC-2026-0398", reason = "Owner: sol pbc engineering. Temporary exception. zstd-safe Seekable::decompress (>= 7.2.2, < 8.2.0): the zstd-safe seekable feature is not enabled, so the affected module is not compiled. Release tooling only: zstd 0.13.3, zstd-safe 7.2.4 and zstd-sys 2.0.16 reach rust-release-manifest directly and via rpm 0.23.5 (zstd ^0.13), never the shipped solstone-linux or solstone-linux-window binaries (normal and build dependencies; only solstone-linux's tests link the tool), and the tool reads only release packages we built or retained locally. Remove all four when rust-release-manifest moves to rpm >= 0.29 and zstd >= 0.14.3 (zstd-safe >= 8.2.0, zstd-sys >= 2.1.2); reassess on any new zstd advisory or a new input source." },
    { id = "RUSTSEC-2026-0403", reason = "Owner: sol pbc engineering. Temporary exception. zstd-safe DCtx::decompress_stream on a failed legacy frame (< 8.2.0): every decoder here is zstd::stream::read::Decoder, which the advisory names as not affected; in practice only our rpm payloads are zstd (our debs are xz). Release tooling only: zstd 0.13.3, zstd-safe 7.2.4 and zstd-sys 2.0.16 reach rust-release-manifest directly and via rpm 0.23.5 (zstd ^0.13), never the shipped solstone-linux or solstone-linux-window binaries (normal and build dependencies; only solstone-linux's tests link the tool), and the tool reads only release packages we built or retained locally. Remove all four when rust-release-manifest moves to rpm >= 0.29 and zstd >= 0.14.3 (zstd-safe >= 8.2.0, zstd-sys >= 2.1.2); reassess on any new zstd advisory or a new input source." },
    { id = "RUSTSEC-2026-0410", reason = "Owner: sol pbc engineering. Temporary exception. zstd-sys wasm32 allocator shim (< 2.1.2): wasm32 only; the tool builds for x86_64 and aarch64 Linux. Release tooling only: zstd 0.13.3, zstd-safe 7.2.4 and zstd-sys 2.0.16 reach rust-release-manifest directly and via rpm 0.23.5 (zstd ^0.13), never the shipped solstone-linux or solstone-linux-window binaries (normal and build dependencies; only solstone-linux's tests link the tool), and the tool reads only release packages we built or retained locally. Remove all four when rust-release-manifest moves to rpm >= 0.29 and zstd >= 0.14.3 (zstd-safe >= 8.2.0, zstd-sys >= 2.1.2); reassess on any new zstd advisory or a new input source." },
]

[licenses]
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/solpbc/spl-rust"]
